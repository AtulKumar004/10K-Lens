[project]
name = "sec-rag"
version = "0.1.0"
description = "SEC filings RAG pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "httpx>=0.28.1",
    "psycopg>=3.3.6",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.1.3",
]

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "secrag"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
files = ["src", "tests", "migrations"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.poe.tasks.redis-up]
help = "Start Redis in WSL Ubuntu and keep WSL alive (foreground; Ctrl+C releases WSL)"
cmd = 'wsl -d Ubuntu -u root bash -c "systemctl start redis-server && systemctl is-active redis-server && exec sleep infinity"'

[tool.poe.tasks.redis-down]
help = "Stop Redis in WSL Ubuntu (data is kept)"
cmd = "wsl -d Ubuntu -u root systemctl stop redis-server"

[tool.poe.tasks.qdrant]
help = "Run Qdrant in the foreground on 127.0.0.1:6333 (data in D:/qdrant/storage)"
cmd = "D:/qdrant/qdrant.exe"
cwd = "D:/qdrant"
env = { QDRANT__SERVICE__HOST = "127.0.0.1" }

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "poethepoet>=0.48.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
